<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f2e9">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="A little Pinguicula garden, slowly drawn into bloom.">
  <title>Pings — a little garden</title>
  <link rel="stylesheet" href="pings.css">
  <script defer src="js/pings.js"></script>
</head>
<body>
  <main>
    <header><a class="wordmark" href="./" aria-label="Pings home">pings<span>✳</span></a><button id="light" type="button" aria-pressed="false">☾ <span>night</span></button></header>
    <section class="garden-space" aria-labelledby="heading">
      <div class="intro"><p class="eyebrow">a little garden</p><h1 id="heading">Room to grow.</h1><p class="subtitle">A quiet corner for some very lovely pings.</p></div>
      <svg id="garden" viewBox="0 130 1000 560" role="img" aria-labelledby="garden-title garden-desc"><title id="garden-title">A bowl of Pinguiculas</title><desc id="garden-desc">Green and blush-pink rosettes nestle around a dark rock in a white ceramic bowl, with moss, black pebbles and one purple flower.</desc></svg>
      <div class="garden-bottom"><span class="botanical">Pinguicula <i>·</i> butterwort</span><button id="replay" type="button"><span aria-hidden="true">↻</span> watch it grow</button></div>
    </section>
    <footer><span>small leaves. slow moments.</span><span>just growing here.</span></footer>
  </main>
  <noscript><p class="fallback">Enable JavaScript to see the garden draw itself.</p></noscript>
</body>
</html>
