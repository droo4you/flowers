<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f2e9">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="A little Pinguicula garden, slowly drawn into bloom.">
  <title>Pings — a little garden</title>
  <link rel="stylesheet" href="pings.css">
  <script defer src="js/pings.js"></script>
</head>
<body>
  <main>
    <header><a class="wordmark" href="./" aria-label="Pings home">pings<span>✳</span></a><button id="light" type="button" aria-pressed="false">☾ <span>night</span></button></header>
    <section class="garden-space" aria-labelledby="heading">
      <div class="intro"><p class="eyebrow">a little garden</p><h1 id="heading">Room to grow.</h1><p class="subtitle">Tap the soil to plant. Tap a ping to bloom.</p></div>
      <svg id="garden" viewBox="0 130 1000 560" role="group" aria-labelledby="garden-title garden-desc"><title id="garden-title">A bowl of Pinguiculas</title><desc id="garden-desc">An interactive white bowl with dark pebbles, moss and a central rock. Tap open soil to grow randomized Pinguiculas. Tap a plant to grow its flower. Use the Plant a ping button and Tab to plants for keyboard access.</desc></svg>
      <div class="garden-bottom"><span class="botanical">Pinguicula <i>·</i> butterwort</span><div class="actions"><button id="plant" type="button">＋ plant a ping</button><button id="reset" type="button">start over</button><button id="replay" type="button" hidden>clear bowl</button></div></div>
      <p id="garden-status" role="status" aria-live="polite">Tap the dark soil to plant your first ping.</p>
    </section>
    <footer><span>small leaves. slow moments.</span><span>just growing here.</span></footer>
  </main>
  <noscript><p class="fallback">Enable JavaScript to see the garden draw itself.</p></noscript>
</body>
</html>
